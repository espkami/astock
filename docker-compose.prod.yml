version: "3.9"

services:
  astock:
    image: ghcr.io/espkami/astock:latest
    container_name: astock_app
    ports:
      - "8000:8000"
    volumes:
      - astock_data:/app/data
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - JWT_SECRET=${JWT_SECRET:-请修改为随机字符串}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
    # 显式指定 DNS，解决容器内无法解析外网域名的问题
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 114.114.114.114
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  astock_data:
    driver: local
